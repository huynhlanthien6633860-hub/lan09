<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Sống Xanh: 10 câu, 200 điểm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f5ec;--card:#fff;--ink:#12372a;--mute:#4f6b5f;--line:#c5e0d0;--ok:#1f8f4e;--okbg:#d5f3e0;--bad:#d64a2a;--badbg:#fde2da;--coin:#f2b134;--coinink:#4a3200;--btn:#12372a;--btnink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2219;--card:#173226;--ink:#e6f5ec;--mute:#9bbcab;--line:#2a4a3a;--ok:#4cd58a;--okbg:#17432b;--bad:#ff8a6a;--badbg:#4a2118;--coin:#f2b134;--coinink:#3a2700;--btn:#e6f5ec;--btnink:#0f2219}}
:root[data-theme="dark"]{--bg:#0f2219;--card:#173226;--ink:#e6f5ec;--mute:#9bbcab;--line:#2a4a3a;--ok:#4cd58a;--okbg:#17432b;--bad:#ff8a6a;--badbg:#4a2118;--coin:#f2b134;--coinink:#3a2700;--btn:#e6f5ec;--btnink:#0f2219}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",Arial,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2.1rem;line-height:1.15;font-weight:800;margin:.4em 0}
.sub{color:var(--mute);margin:0 0 1.2em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.tiers{display:grid;gap:8px;margin:16px 0}
.tier{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:12px;background:var(--bg)}
.coin{display:inline-flex;align-items:center;justify-content:center;min-width:3.4em;padding:.15em .7em;border-radius:99px;background:var(--coin);color:var(--coinink);font-weight:800}
button{font:inherit;cursor:pointer}
.go{width:100%;padding:14px;border:0;border-radius:12px;background:var(--btn);color:var(--btnink);font-weight:800;font-size:1.05rem}
.go:focus-visible,.opt:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dots{display:flex;gap:5px;margin-bottom:16px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.done{background:var(--ok)}.dots i.now{background:var(--coin)}
.q{font-size:1.25rem;font-weight:600;margin:.4em 0 1em}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.fb b{display:block;margin-bottom:2px}
.big{font-size:4.2rem;font-weight:800;line-height:1;margin:.1em 0}
.rank{font-size:1.35rem;font-weight:800;margin:.2em 0}
table{width:100%;border-collapse:collapse;margin:14px 0}
td{padding:7px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:600}
.small{color:var(--mute);font-size:.9rem}
input{font:inherit;width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-bottom:12px}
input:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
#lb{margin-top:14px}
.lbh{display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px}
.row.me{background:var(--okbg)}
.pos{width:1.6em;font-weight:800}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-weight:800}
</style>
</head>
<body>
<main id="app"></main>
<script>
var Q=[
{d:1,q:"Bạn quên mang túi vải đi chợ, chỉ mua vài món. Cách ít xanh nhất để xử lý là gì?",a:["Xách tay hoặc ôm hết","Dùng lại túi cũ có sẵn trong cốp xe","Lấy 5 túi nhựa cho chắc, khỏi sợ rách","Nhờ người bán gộp vào một túi"],c:2,e:"Lấy dư túi nhựa là lựa chọn tệ nhất. Mua ít thì xách tay hoặc dùng lại túi cũ là đủ."},
{d:1,q:"Chải răng mà để vòi nước chảy suốt 2 phút. Bạn nên làm gì?",a:["Tắt vòi khi đang chải, mở lại để súc miệng","Cứ để chảy cho nhanh","Mở nhỏ lại nhưng vẫn chảy","Chải răng ở ngoài ban công"],c:0,e:"Chỉ cần tắt vòi trong lúc chải là tiết kiệm được rất nhiều nước, không tốn thêm công sức."},
{d:1,q:"Cách đơn giản nhất để giảm rác nhựa dùng một lần mỗi ngày là gì?",a:["Mua thêm thật nhiều chai nước nhỏ","Mang bình nước và hộp cơm riêng","Dùng ống hút giấy cho mọi ly nước","Đợi chính phủ giải quyết"],c:1,e:"Dùng đi dùng lại một vật dụng là cách giảm rác hiệu quả nhất, rẻ nhất và dễ làm nhất."},
{d:2,q:"Hộp giấy đựng đồ ăn dính nhiều dầu mỡ. Bạn nên làm gì với nó?",a:["Bỏ vào thùng giấy tái chế","Bỏ vào rác thường","Rửa bằng nước nóng rồi tái chế","Đốt cho sạch"],c:1,e:"Giấy dính dầu mỡ thường không tái chế được vì làm hỏng mẻ bột giấy, nên bỏ vào rác thường."},
{d:2,q:"Đặt máy lạnh ở mức nào là hợp lý hơn cả về tiền điện lẫn thoải mái?",a:["16 độ cho mát nhanh","18 độ rồi chùm chăn","Khoảng 26-27 độ","Tắt hẳn quanh năm"],c:2,e:"Khoảng 26-27 độ vừa đủ mát, lại tiết kiệm điện hơn đáng kể so với đặt quá thấp."},
{d:2,q:"Cách giảm lãng phí thực phẩm hiệu quả nhất trong nhà là gì?",a:["Mua thật nhiều để khỏi đi chợ","Lên kế hoạch mua và bảo quản đúng cách","Chỉ ăn ở ngoài","Đổ hết đồ thừa vào cuối tuần"],c:1,e:"Mua đúng nhu cầu và bảo quản tốt giúp bạn bỏ ít đồ nhất, tiết kiệm luôn cả tiền."},
{d:2,q:"Pin cũ và bóng đèn huỳnh quang hỏng nên bỏ ở đâu?",a:["Thùng rác sinh hoạt thông thường","Thùng rác tái chế giấy","Điểm thu gom rác nguy hại riêng","Chôn ở sân sau"],c:2,e:"Chúng chứa chất độc hại với môi trường, cần bỏ ở điểm thu gom riêng chứ không bỏ chung với rác thường."},
{d:3,q:"Nhận định: \"Xe điện hoàn toàn không gây ô nhiễm.\" Câu nào đúng nhất?",a:["Đúng, vì không có khói","Sai, vì sản xuất pin và nguồn điện vẫn tác động môi trường","Đúng, nhưng chỉ khi chạy ban đêm","Sai, vì xe điện thải khói đen"],c:1,e:"Xe điện không thải khí ở ống xả, nhưng việc sản xuất pin và cách sản xuất điện vẫn để lại tác động."},
{d:3,q:"Ký hiệu mũi tên tam giác trên đáy chai nhựa có nghĩa gì?",a:["Chai này chắc chắn được tái chế ở mọi nơi","Cho biết loại nhựa, chưa chắc nơi bạn ở tái chế được","Chai đã được tái chế rồi","Chai không cần rửa"],c:1,e:"Ký hiệu thường chỉ loại nhựa. Việc có được tái chế hay không còn tùy hệ thống thu gom ở địa phương."},
{d:3,q:"Nhà đã có 3 bình nước dùng tốt, nhưng bạn đang muốn mua thêm một bình \"xanh\" mới. Lựa chọn xanh nhất là gì?",a:["Mua bình mới để ủng hộ môi trường","Mua cả bộ 5 bình cho đủ màu","Dùng tiếp các bình đã có","Vứt hết bình cũ rồi mua mới"],c:2,e:"Món đồ xanh nhất là món bạn đã có và dùng đến hết vòng đời. Mua thêm đồ \"xanh\" vẫn là mua thêm."}
];
var PTS={1:10,2:20,3:30},NAME={1:"Dễ",2:"Vừa",3:"Khó"};
var MAX=Q.reduce(function(s,x){return s+PTS[x.d]},0);
var app=document.getElementById("app"),i=0,score=0,res=[],nick="",room=null,peers=[],fin=false;
function pub(){if(room){try{room.presence({name:nick,score:score,q:i,done:fin}).catch(function(){})}catch(e){}}}
function drawLB(){
 var el=document.getElementById("lb");if(!el||!room)return;
 var L=peers.filter(function(p){return p.kind==="viewer"&&p.presence&&typeof p.presence.name==="string"}).sort(function(a,b){return (b.presence.score-a.presence.score)||(b.presence.q-a.presence.q)}).slice(0,8);
 el.textContent="";if(!L.length)return;
 var box=document.createElement("div");box.className="card";
 var h=document.createElement("div");h.className="lbh";h.innerHTML="<span>Bảng xếp hạng trực tiếp</span><span class='small'>"+peers.length+" người đang xem</span>";box.appendChild(h);
 L.forEach(function(p,k){
  var r=document.createElement("div");r.className="row"+(p.isMe&&p.sameTab?" me":"");
  var a=document.createElement("span");a.className="pos";a.textContent=k+1;
  var b=document.createElement("span");b.className="nm";b.textContent=String(p.presence.name).slice(0,16)+(p.isMe&&p.sameTab?" (bạn)":"");
  var c=document.createElement("span");c.className="small";c.textContent=p.presence.done?"xong":"câu "+Math.min(10,(+p.presence.q||0)+1);
  var d=document.createElement("span");d.className="sc";d.textContent=(+p.presence.score||0);
  r.appendChild(a);r.appendChild(b);r.appendChild(c);r.appendChild(d);box.appendChild(r);
 });
 el.appendChild(box);
}
(function(){try{if(window.claude&&claude.use){claude.use("room").then(function(r){if(!r)return;room=r;peers=r.peers();r.onPeers(function(c){peers=c.peers;drawLB()});drawLB();pub()}).catch(function(){})}}catch(e){}})();
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuf(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}
function best(){try{return +localStorage.getItem("quizxanh_best")||0}catch(e){return 0}}
function saveBest(v){try{if(v>best())localStorage.setItem("quizxanh_best",String(v))}catch(e){}}
function start(){
 i=0;score=0;res=[];fin=false;
 app.innerHTML='<h1>Quiz Sống Xanh</h1><p class="sub">10 câu hỏi, '+MAX+' điểm. Câu càng khó càng nhiều điểm. Sai thì không bị trừ, nhưng sẽ bị cà khịa nhẹ.</p>'+
 '<div class="card"><div class="tiers">'+
 [1,2,3].map(function(d){var n=Q.filter(function(x){return x.d===d}).length;return '<div class="tier"><span>'+NAME[d]+' ('+n+' câu)</span><span class="coin">+'+PTS[d]+'</span></div>'}).join("")+
 '</div><input id="nk" maxlength="16" autocomplete="off" placeholder="Biệt danh của bạn (hiện trên bảng xếp hạng)" value="'+nick.replace(/"/g,"")+'"><button class="go" id="s">Bắt đầu</button></div>'+
 (best()?'<p class="small">Điểm cao nhất của bạn trên máy này: '+best()+'/'+MAX+'</p>':'');
 app.insertAdjacentHTML("beforeend",'<div id="lb"></div>');drawLB();
 document.getElementById("s").onclick=function(){nick=document.getElementById("nk").value.trim()||("Ẩn danh "+Math.floor(Math.random()*90+10));pub();show()};
}
function show(){
 var x=Q[i],ord=shuf([0,1,2,3]),done=false;
 var dots=Q.map(function(_,k){return '<i class="'+(k<i?'done':k===i?'now':'')+'"></i>'}).join("");
 app.innerHTML='<div class="top"><span>Câu '+(i+1)+'/10 &middot; '+NAME[x.d]+'</span><span class="coin">+'+PTS[x.d]+'</span></div>'+
 '<div class="dots">'+dots+'</div><div class="card"><p class="q">'+x.q+'</p><div class="opts" id="o"></div><div id="f" aria-live="polite"></div></div><div id="lb"></div>';
 drawLB();pub();
 var o=document.getElementById("o");
 ord.forEach(function(idx){
  var b=document.createElement("button");b.className="opt";b.textContent=x.a[idx];
  b.onclick=function(){
   if(done)return;done=true;
   var ok=idx===x.c;if(ok)score+=PTS[x.d];res.push({d:x.d,ok:ok});pub();
   Array.prototype.forEach.call(o.children,function(c,k){c.disabled=true;if(ord[k]===x.c)c.className="opt right";else if(c===b)c.className="opt wrong"});
   var f=document.getElementById("f");
   f.innerHTML='<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'Chuẩn! +'+PTS[x.d]+' điểm':'Ê chề nhẹ, +0 điểm')+'</b>'+x.e+'</div><button class="go" id="n" style="margin-top:12px">'+(i<Q.length-1?'Câu tiếp theo':'Xem kết quả')+'</button>';
   var n=document.getElementById("n");n.focus();n.onclick=function(){i++;i<Q.length?show():end()};
  };
  o.appendChild(b);
 });
}
function rank(p){
 if(p>=.85)return["Chiến binh xanh","Trái Đất gửi lời cảm ơn. Nhớ giữ phong độ nhé."];
 if(p>=.6)return["Người xanh có tâm","Bạn biết khá nhiều, chỉ cần thêm vài thói quen nữa."];
 if(p>=.35)return["Xanh tập sự","Vẫn còn ly trà sữa nhựa ở đâu đó quanh bạn."];
 return["Kẻ phá hoại bất đắc dĩ","Đừng buồn, ai cũng từng bắt đầu từ đây. Thử lại nào!"];
}
function end(){
 saveBest(score);fin=true;i=Q.length-1;pub();var r=rank(score/MAX);
 var rows=[1,2,3].map(function(d){var t=res.filter(function(x){return x.d===d}),g=t.filter(function(x){return x.ok}).length;return '<tr><td>'+NAME[d]+'</td><td>'+g+'/'+t.length+' đúng</td><td>'+g*PTS[d]+'/'+t.length*PTS[d]+'</td></tr>'}).join("");
 app.innerHTML='<div class="card" style="text-align:center"><p class="small">'+(nick?esc(nick)+', điểm của bạn':'Điểm của bạn')+'</p><div class="big">'+score+'<span class="small" style="font-size:1.4rem"> /'+MAX+'</span></div><p class="rank">'+r[0]+'</p><p class="sub">'+r[1]+'</p><p class="small">Đọc tên và điểm này cho người dẫn để lên bảng xếp hạng.</p></div>'+
 '<div class="card" style="margin-top:12px"><table><tbody>'+rows+'</tbody></table><button class="go" id="r">Chơi lại</button></div><div id="lb"></div>';
 drawLB();
 document.getElementById("r").onclick=start;
}
start();
</script>
</body>
</html>
